name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: Europe/Rome
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, typecheck e test unitari
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The clock helper must not depend on the host time zone (Vercel runs in UTC).
      - name: Test unitari dell'orario con TZ=UTC
        run: npx vitest run src/lib/time
        env:
          TZ: UTC

  storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 7

  e2e:
    name: E2E Playwright + axe (WCAG 2.2 AA)
    needs: storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          STORYBOOK_PREBUILT: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  supabase:
    name: Supabase locale (registro, coda email, Mailpit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Only what the tests use: Postgres, Auth, REST, Edge Functions, Mailpit.
      - run: supabase start -x studio,imgproxy,storage-api,logflare,vector,supavisor,realtime,postgres-meta
      - name: Test pgTAP del database (registro in sola aggiunta, coda email)
        run: supabase test db
      - name: Variabili di Supabase locale per i test
        run: supabase status -o env | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"
      - name: E2E email su Mailpit (Supabase Auth ed Edge Function)
        run: npx playwright test --config playwright.supabase.config.ts
        env:
          MAILPIT_URL: http://127.0.0.1:54324
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-supabase
          path: playwright-report
          retention-days: 7
      - name: Log della Edge Function
        if: failure()
        run: docker logs supabase_edge_runtime_blvs-manage-tournament 2>&1 | tail -200
